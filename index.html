<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSI - Environmental Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Confetti Animation Styles */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: linear-gradient(135deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
            top: -10px;
            border-radius: 2px;
            animation: confetti-fall 3s ease-out forwards;
            pointer-events: none;
            z-index: 3000;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Sticker Popup Styles - Clean Layout */
        .sticker-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2500;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .sticker-overlay.is-visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .sticker-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            max-width: 550px;
            width: 90%;
        }

        /* Individual Sticker Designs */
        .sticker {
            position: relative;
            opacity: 0;
            transform: scale(0.8) translateY(20px);
            transition: all 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
        }

        .sticker-overlay.is-visible .sticker {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .sticker-overlay.is-visible .sticker:nth-child(1) { transition-delay: 0s; }
        .sticker-overlay.is-visible .sticker:nth-child(2) { transition-delay: 0.08s; }
        .sticker-overlay.is-visible .sticker:nth-child(3) { transition-delay: 0.16s; }
        .sticker-overlay.is-visible .sticker:nth-child(4) { transition-delay: 0.24s; }

        /* Title Sticker */
        .sticker-title {
            background: linear-gradient(135deg, #003f5c, #0ea5e9);
            padding: 14px 35px;
            border-radius: 50px;
            color: white;
            font-size: 1.6rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: -0.01em;
            box-shadow: 0 12px 28px rgba(0, 63, 92, 0.25);
            transform: rotate(-1deg);
            transition: transform 0.2s ease;
        }

        .sticker-title:hover {
            transform: rotate(0deg) scale(1.02);
        }

        /* Description Sticker */
        .sticker-description {
            background: white;
            padding: 18px 24px;
            border-radius: 20px;
            color: #1e293b;
            font-size: 0.95rem;
            line-height: 1.6;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(14, 165, 233, 0.2);
            transform: rotate(1deg);
        }

        .sticker-description:hover {
            transform: rotate(0deg);
        }

        /* Triplet Stickers Row */
        .sticker-triplet {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .sticker-item {
            background: white;
            border-radius: 16px;
            padding: 12px;
            width: 140px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            transition: all 0.25s ease;
            cursor: default;
            border: 1px solid rgba(0, 63, 92, 0.08);
        }

        .sticker-item:nth-child(1) { transform: rotate(-2deg); }
        .sticker-item:nth-child(2) { transform: rotate(1deg); }
        .sticker-item:nth-child(3) { transform: rotate(-1deg); }

        .sticker-item:hover {
            transform: rotate(0deg) translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        .sticker-item__image {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 10px;
            background: #f0f9ff;
        }

        .sticker-item__image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sticker-item__label {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748b;
            margin-top: 6px;
        }

        .sticker-item__title {
            font-size: 0.75rem;
            font-weight: 600;
            color: #1e293b;
            margin-top: 5px;
            line-height: 1.3;
        }

        /* Button Sticker */
        .sticker-button {
            background: linear-gradient(135deg, #b91c1c, #dc2626);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(185, 28, 28, 0.3);
            transform: rotate(0.5deg);
            font-family: inherit;
        }

        .sticker-button:hover {
            transform: rotate(0deg) scale(1.03);
            box-shadow: 0 12px 28px rgba(185, 28, 28, 0.35);
            background: linear-gradient(135deg, #dc2626, #b91c1c);
        }

        /* Decorative floating elements */
        .sticker-decoration {
            position: absolute;
            width: 150px;
            height: 150px;
            pointer-events: none;
            opacity: 0.4;
            border-radius: 50%;
            filter: blur(60px);
        }

        .sticker-decoration--1 {
            top: -60px;
            left: -60px;
            background: #0ea5e9;
            animation: floatSlow 6s ease-in-out infinite;
        }

        .sticker-decoration--2 {
            bottom: -60px;
            right: -60px;
            background: #b91c1c;
            animation: floatSlow 8s ease-in-out infinite reverse;
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-15px) translateX(10px); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .sticker-container {
                gap: 15px;
            }
            
            .sticker-title {
                font-size: 1.3rem;
                padding: 10px 25px;
            }
            
            .sticker-description {
                font-size: 0.85rem;
                padding: 14px 18px;
            }
            
            .sticker-triplet {
                gap: 12px;
            }
            
            .sticker-item {
                width: 110px;
                padding: 8px;
            }
            
            .sticker-item__label {
                font-size: 0.6rem;
            }
            
            .sticker-item__title {
                font-size: 0.7rem;
            }
            
            .sticker-button {
                padding: 10px 24px;
                font-size: 0.85rem;
            }
        }
    </style>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="logo-mark">
            <img src="pics/logo.png" alt="MSI Academy" class="logo-img" width="52" height="52">
        </div>
        <div class="header-text">
            <h1 class="logo" aria-label="MSI Academy">
                <span class="logo-msi">MSI</span>
                <span class="logo-academy"> Academy</span>
            </h1>
        </div>
    </header>

    <!-- Centered Game Instruction Header -->
    <div class="game-header">
        <p class="game-tagline">Scroll, then drag cause &amp; solution cards to match the problem</p>
    </div>

    <div class="progress-wrap" aria-hidden="true">
        <div id="level-progress" class="progress-bar"></div>
    </div>

    <main class="content" id="game-board">
        <section class="column column--cause animate-in" style="--delay: 0.1s" aria-labelledby="label-cause">
            <h2 class="column-label" id="label-cause"><span class="label-dot label-dot--cause"></span>Cause</h2>
            
            <div class="scroll-wrapper">
                <div class="scroll-arrow-container scroll-arrow-container--up" aria-hidden="true">
                    <svg class="scroll-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
                </div>
                
                <div id="cause-scroll" class="card-scroll" role="list" aria-label="Cause cards"></div>
                
                <div class="scroll-arrow-container scroll-arrow-container--down" aria-hidden="true">
                    <svg class="scroll-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20l8-8h-5V4h-6v8H4z"/></svg>
                </div>
            </div>
        </section>

        <section class="column column--problem animate-in" style="--delay: 0.2s" aria-labelledby="label-problem">
            <h2 class="column-label column-label--problem" id="label-problem">
                <span class="label-dot label-dot--problem"></span>Problem
            </h2>
            <p id="level-indicator" class="level-indicator"></p>
            <div class="problem-panel">
                <h3 id="problem-heading" class="problem-heading"></h3>
                <div id="problem-image" class="problem-card media-swap"></div>
                <div class="drop-row">
                    <div id="cause-drop" class="drop-zone drop-zone--cause" data-accept="cause">
                        <span class="drop-zone__label">Cause</span>
                        <span class="drop-zone__hint">Drop here</span>
                    </div>
                    <div id="solution-drop" class="drop-zone drop-zone--solution" data-accept="solution">
                        <span class="drop-zone__label">Solution</span>
                        <span class="drop-zone__hint">Drop here</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="column column--solution animate-in" style="--delay: 0.3s" aria-labelledby="label-solution">
            <h2 class="column-label" id="label-solution"><span class="label-dot label-dot--solution"></span>Solution</h2>
            <div class="scroll-wrapper">
                <div class="scroll-arrow-container scroll-arrow-container--up" aria-hidden="true">
                    <svg class="scroll-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
                </div>
                
                <div id="solution-scroll" class="card-scroll" role="list" aria-label="Solution cards"></div>
                
                <div class="scroll-arrow-container scroll-arrow-container--down" aria-hidden="true">
                    <svg class="scroll-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20l8-8h-5V4h-6v8H4z"/></svg>
                </div>
            </div>
        </section>
    </main>

    <div id="game-feedback" class="game-feedback" role="status" aria-live="polite"></div>

    <!-- Sticker Style Popup - No Check Icon -->
    <div id="result-sticker" class="sticker-overlay" aria-hidden="true">
        <div class="sticker-container">
            <div class="sticker-decoration sticker-decoration--1"></div>
            <div class="sticker-decoration sticker-decoration--2"></div>
            
            <div class="sticker">
                <div class="sticker-title">Challenge Succeeded</div>
            </div>
            
            <div class="sticker">
                <div id="sticker-description-text" class="sticker-description"></div>
            </div>
            
            <div class="sticker">
                <div class="sticker-triplet">
                    <div id="sticker-prob" class="sticker-item">
                        <div class="sticker-item__image"></div>
                        <div class="sticker-item__label">PROBLEM</div>
                        <div class="sticker-item__title"></div>
                    </div>
                    <div id="sticker-cause" class="sticker-item">
                        <div class="sticker-item__image"></div>
                        <div class="sticker-item__label">CAUSE</div>
                        <div class="sticker-item__title"></div>
                    </div>
                    <div id="sticker-sol" class="sticker-item">
                        <div class="sticker-item__image"></div>
                        <div class="sticker-item__label">SOLUTION</div>
                        <div class="sticker-item__title"></div>
                    </div>
                </div>
            </div>
            
            <div class="sticker">
                <button id="next-level-sticker" class="sticker-button">Continue to Next Challenge →</button>
            </div>
        </div>
    </div>

    <script src="js/game-data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
